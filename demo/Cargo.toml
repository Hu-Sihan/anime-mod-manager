[package]
name = "mod-manager-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anime-mod-manager = { path = ".." }

gtk = { version = "0.9", features = ["v4_16"], package = "gtk4" }
adw = { version = "0.7", features = ["v1_5"], package = "libadwaita" }
gdk-pixbuf = { version = "0.20", package = "gdk-pixbuf" }
open = "5"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
minreq = { version = "2", features = ["https"] }
zip = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
